# Screen configuration for psp2sgx gallium driver

# Supported visual configurations
config_psp2sgx_8888 {
    rgb bits-per-pixel = 32
    rgba bits-per-pixel = 32
    double_buffer = true
}

config_psp2sgx_565 {
    rgb bits-per-pixel = 16
    rgba bits-per-pixel = 16
    double_buffer = false
}

config_psp2sgx_4444 {
    rgb bits-per-pixel = 12
    rgba bits-per-pixel = 12
    double_buffer = false
}

# Format table
format_table {
    format ARGB_8888 {
        weight = 0xFF000000, 0x00FF0000, 0x0000FF00, 0x000000FF
    }
    format RGB_565 {
        weight = 0xF800, 0x07E0, 0x001F
    }
    format RGBA_4444 {
        weight = 0xF000, 0x0F00, 0x00F0, 0x000F
    }
}