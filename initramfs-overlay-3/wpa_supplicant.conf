# Wi-Fi supplicant seed for Android 4.2.2 on the PlayStation Vita.
#
# init.vita.rc copies this file to /data/misc/wifi/wpa_supplicant.conf before
# the framework starts.  /vita-net.sh then rewrites the control-interface
# settings in place, so edit the network list on ur0 instead:
#
#     ur0:/android/wpa_supplicant.conf
#
# Example network block:
#
#     network={
#         ssid="MyNetwork"
#         psk="secret"
#     }
#
# The DIR=... GROUP=1010 form is required: WifiService runs as uid 1000 and
# opens /data/system/wpa_supplicant/mlan0, so the socket has to be group wifi
# (1010).  A plain ctrl_interface=<dir> would leave it root:root 0770.

ctrl_interface=DIR=/data/system/wpa_supplicant GROUP=1010
update_config=1
disable_scan_offload=1
country=IE
