name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Prefer public DNS
        # The hosted runner's default resolver intermittently fails for
        # archive.ubuntu.com and can leave apt hanging for tens of minutes.
        # Put public resolvers first and keep the platform ones as fallback.
        run: |
          if [ -f /etc/resolv.conf ]; then
            sudo cp /etc/resolv.conf /etc/resolv.conf.platform
            {
              echo 'nameserver 1.1.1.1'
              echo 'nameserver 8.8.8.8'
              echo 'options timeout:2 attempts:2'
              cat /etc/resolv.conf.platform
            } > /tmp/resolv.conf.new
            sudo cp /tmp/resolv.conf.new /etc/resolv.conf \
              || echo "could not rewrite /etc/resolv.conf; keeping the platform resolver"
          fi
          getent hosts archive.ubuntu.com || true

      - name: Install build dependencies
        timeout-minutes: 20
        # A single apt run aborts the job when the resolver fails mid-flight,
        # so retry the update/install pair with bounded timeouts.
        run: |
          apt_opts=(
            -o Acquire::ForceIPv4=true
            -o Acquire::Retries=5
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )
          packages=(
            bc
            bison
            ca-certificates
            device-tree-compiler
            flex
            gcc-arm-linux-gnueabihf
            libelf-dev
            libssl-dev
            python3
            xz-utils
          )
          for attempt in 1 2 3; do
            echo "apt attempt $attempt"
            if sudo apt-get "${apt_opts[@]}" update \
               && sudo apt-get "${apt_opts[@]}" install \
                    -y --no-install-recommends "${packages[@]}"; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "could not install build dependencies after 3 attempts" >&2
          exit 1

      - name: Cache kernel tarball
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: linux-vita-a33b819fd7174f60b1d5bcb613de565b3f046687

      - name: Build boot package
        # The job log is only visible to signed-in users on a public repo.
        # Mirror the tail of the build output into an always-visible check
        # annotation and the job summary so failures can be diagnosed from
        # the API without credentials.
        run: |
          set +e
          bash scripts/build.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## Build failed (exit $status)"
              echo '```'
              tail -n 100 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            message=$(tail -n 60 build.log | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' | cut -c1-60000)
            echo "::error title=Build boot package failed::$message"
            exit "$status"
          fi

      - name: Show build information
        run: |
          cat build/out/build-info.txt
          cat build/out/SHA256SUMS

      - name: Upload boot package
        uses: actions/upload-artifact@v4
        with:
          name: android-on-vita-boot
          if-no-files-found: error
          path: |
            build/out/zImage
            build/out/vita.dtb
            build/out/vita1000.dtb
            build/out/vita-selinux-disabled.dtb
            build/out/initramfs.cpio
            build/out/SHA256SUMS
            build/out/build-info.txt
