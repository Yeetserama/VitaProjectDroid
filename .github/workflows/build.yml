      - name: Cache kernel tarball
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: linux-vita-a33b819fd7174f60b1d5bcb613de565b3f046687

      - name: Download Android 2.2 SDK images
        run: |
          # Android 2.2 (API 8) images may not be available via sdkmanager anymore.
          # This step will attempt to download but may fail - the ramdisk-2.2.img
          # should be pre-provided in prebuilt/ for CI to work reliably.
          SDK_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -L -o /tmp/cmdline-tools.zip "$SDK_URL" 2>/dev/null || true
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools 2>/dev/null || true
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest 2>/dev/null || true
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "system-images;android-8;default;armeabi-v7a" 2>/dev/null || echo "Android 2.2 SDK image not available via sdkmanager (expected)"

      - name: Build Android 2.2 boot package
