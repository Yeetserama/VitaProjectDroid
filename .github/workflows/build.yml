name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build dependencies
        # The hosted runner's resolver occasionally fails for archive.ubuntu.com
        # for many minutes at a time. A single apt run then aborts the whole
        # job, so retry the update/install pair a few times with IPv4 forced.
        run: |
          packages=(
            bc
            bison
            ca-certificates
            device-tree-compiler
            flex
            gcc-arm-linux-gnueabihf
            libelf-dev
            libssl-dev
            python3
            xz-utils
          )
          for attempt in 1 2 3 4 5; do
            echo "apt attempt $attempt"
            if sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 update \
               && sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 install \
                    -y --no-install-recommends "${packages[@]}"; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          echo "could not install build dependencies after 5 attempts" >&2
          exit 1

      - name: Cache kernel tarball
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: linux-vita-a33b819fd7174f60b1d5bcb613de565b3f046687

      - name: Build boot package
        # The job log is only visible to signed-in users on a public repo.
        # Mirror the tail of the build output into an always-visible check
        # annotation and the job summary so failures can be diagnosed from
        # the API without credentials.
        run: |
          set +e
          bash scripts/build.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## Build failed (exit $status)"
              echo '```'
              tail -n 100 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            message=$(tail -n 60 build.log | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' | cut -c1-60000)
            echo "::error title=Build boot package failed::$message"
            exit "$status"
          fi

      - name: Show build information
        run: |
          cat build/out/build-info.txt
          cat build/out/SHA256SUMS

      - name: Upload boot package
        uses: actions/upload-artifact@v4
        with:
          name: android-on-vita-boot
          if-no-files-found: error
          path: |
            build/out/zImage
            build/out/vita.dtb
            build/out/vita1000.dtb
            build/out/vita-selinux-disabled.dtb
            build/out/initramfs.cpio
            build/out/SHA256SUMS
            build/out/build-info.txt
