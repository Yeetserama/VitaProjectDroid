name: build

on:
  push:
    branches: [ re/bt ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bt-diag-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Prefer public DNS
        # The hosted runner's default resolver intermittently fails for
        # archive.ubuntu.com and can leave apt hanging for tens of minutes.
        # Put public resolvers first and keep the platform ones as fallback.
        run: |
          if [ -f /etc/resolv.conf ]; then
            sudo cp /etc/resolv.conf /etc/resolv.conf.platform
            {
              echo 'nameserver 1.1.1.1'
              echo 'nameserver 8.8.8.8'
              echo 'options timeout:2 attempts:2'
              cat /etc/resolv.conf.platform
            } > /tmp/resolv.conf.new
            sudo cp /tmp/resolv.conf.new /etc/resolv.conf \
              || echo "could not rewrite /etc/resolv.conf; keeping the platform resolver"
          fi
          getent hosts archive.ubuntu.com || true

      - name: Install build dependencies
        timeout-minutes: 20
        # A single apt run aborts the job when the resolver fails mid-flight,
        # so retry a few times with a short backoff.
        run: |
          apt_opts=(
            -o Acquire::ForceIPv4=true
            -o Acquire::Retries=5
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )
          packages=(
            bc
            bison
            ca-certificates
            device-tree-compiler
            e2fsprogs
            flex
            gcc-arm-linux-gnueabihf
            libelf-dev
            libssl-dev
            python3
            unzip
            xz-utils
          )
          for attempt in 1 2 3; do
            echo "apt attempt $attempt"
            if sudo apt-get "${apt_opts[@]}" update \
               && sudo apt-get "${apt_opts[@]}" install \
                    -y --no-install-recommends "${packages[@]}"; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "could not install build dependencies after 3 attempts" >&2
          exit 1

      - name: Cache kernel tarball
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: linux-vita-a33b819fd7174f60b1d5bcb613de565b3f046687

      - name: Build SD8787 diagnostic kernel
        # re/bt D1: probe-only register dump, no firmware download.  Build
        # against the verified 5.1.1 userspace so the only new variable is
        # the Bluetooth probe.  No Android images are needed; the artifact
        # replaces only zImage on an existing 5.1.1 kit.
        env:
          BT_DIAG: "1"
        run: |
          set +e
          ANDROID_VERSION=5.1 bash scripts/build.sh 2>&1 | tee build-bt-diag.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## Build failed (exit $status)"
              echo '```'
              tail -n 100 build-bt-diag.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            message=$(tail -n 60 build-bt-diag.log | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }' | cut -c1-60000)
            echo "::error title=Build diagnostic kernel failed::$message"
            exit "$status"
          fi

      - name: Show build information
        run: |
          cat build/out/build-info.txt
          cat build/out/SHA256SUMS

      - name: Upload SD8787 diagnostic kernel
        uses: actions/upload-artifact@v4
        with:
          name: android-5.1.1-bt-diag
          if-no-files-found: error
          path: |
            build/out/zImage
            build/out/vita.dtb
            build/out/vita1000.dtb
            build/out/vita-selinux-disabled.dtb
            build/out/initramfs.cpio
            build/out/SHA256SUMS
            build/out/build-info.txt
